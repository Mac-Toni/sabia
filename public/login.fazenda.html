<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Login - Fazenda Sabiá</title>
    <link rel="stylesheet" href="css/estilo.fazenda.css">
    <style>
        .login-container {
            max-width: 420px;
            margin: 80px auto;
            background: var(--branco);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-top: 4px solid var(--dourado);
        }
        .login-container h2 {
            color: var(--azul-escuro);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--azul-escuro);
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: var(--dourado);
        }
        .btn-login {
            width: 100%;
            background-color: var(--dourado);
            color: var(--azul-escuro);
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background-color: var(--dourado-hover);
        }
        .erro-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }
        .voltar-site {
            text-align: center;
            margin-top: 20px;
        }
        .voltar-site a {
            color: var(--azul-escuro);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .voltar-site a:hover {
            color: var(--dourado);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Painel Administrativo</h2>
        <div id="erro-box" class="erro-msg"></div>

        <form id="form-login">
            <div class="form-group">
                <label for="cpf">CPF do Administrador</label>
                <input type="text" id="cpf" placeholder="Digite apenas números ou com pontos" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="senha">Senha de Acesso</label>
                <input type="password" id="senha" placeholder="********" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>

        <div class="voltar-site">
            <a href="landing.fazenda.html">&larr; Voltar para o site principal</a>
        </div>
    </div>

    <!-- Script de autenticação -->
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cpf = document.getElementById('cpf').value.trim();
            const senha = document.getElementById('senha').value;
            const erroBox = document.getElementById('erro-box');

            erroBox.style.display = 'none';

            try {
                const resposta = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf, senha })
                });

                const resultado = await resposta.json();

                if (resposta.ok && resultado.sucesso) {
                    // Salva a permissão de sessão e redireciona para o painel
                    localStorage.setItem('fazenda_admin_auth', 'true');
                    window.location.href = 'admin.fazenda.html';
                } else {
                    erroBox.textContent = resultado.mensagem || 'CPF ou senha inválidos.';
                    erroBox.style.display = 'block';
                }
            } catch (err) {
                console.error('Erro no login:', err);
                erroBox.textContent = 'Erro de conexão com o servidor.';
                erroBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
