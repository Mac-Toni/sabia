<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Animal - Fazenda Sabiá</title>
    <link rel="stylesheet" href="css/estilo.fazenda.css">
    <style>
        .container-detalhe {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }
        .voltar-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--azul-escuro);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .voltar-link:hover {
            color: var(--dourado-hover);
        }
        .detalhe-grid {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 40px;
            background: var(--branco);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid var(--dourado);
        }

        /* CARROSSEL DE 5 FOTOS */
        .carrossel-container {
            position: relative;
            width: 100%;
            background: var(--azul-escuro);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--dourado);
        }
        .carrossel-principal {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
        }
        .btn-carrossel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 30, 63, 0.75);
            color: var(--dourado);
            border: 1px solid var(--dourado);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .btn-carrossel:hover {
            background: var(--azul-escuro);
        }
        .btn-prev { left: 12px; }
        .btn-next { right: 12px; }

        .miniaturas-grid {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .miniatura-item {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.2s;
        }
        .miniatura-item.ativa, .miniatura-item:hover {
            border-color: var(--dourado);
            opacity: 1;
            transform: scale(1.05);
        }

        /* PLAYER DE VÍDEO (MÁX 1 MIN) */
        .video-section {
            margin-top: 25px;
            background: var(--fundo-claro);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .video-section h4 {
            color: var(--azul-escuro);
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .video-player {
            width: 100%;
            max-height: 320px;
            border-radius: 6px;
            background: #000;
        }

        /* INFORMAÇÕES DO ANIMAL */
        .info-animal h1 {
            color: var(--azul-escuro);
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .tag-tatuagem {
            display: inline-block;
            background: var(--azul-medio);
            color: var(--branco);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .ficha-tecnica {
            background: var(--fundo-claro);
            border-left: 4px solid var(--dourado);
            padding: 15px 20px;
            border-radius: 0 6px 6px 0;
            margin: 20px 0;
        }
        .ficha-linha {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ccc;
            font-size: 0.95rem;
        }
        .ficha-linha:last-child {
            border-bottom: none;
        }
        .ficha-linha span:first-child {
            color: #555;
            font-weight: 600;
        }
        .ficha-linha span:last-child {
            color: var(--azul-escuro);
            font-weight: bold;
        }
        .info-adicionais {
            margin: 20px 0;
        }
        .info-adicionais h3 {
            color: var(--azul-escuro);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .info-adicionais p {
            line-height: 1.6;
            color: var(--texto-escuro);
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #eee;
            white-space: pre-line;
        }
        .box-compra {
            margin-top: 25px;
            padding: 20px;
            background: var(--azul-escuro);
            color: var(--branco);
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--dourado);
        }
        .box-compra .label-preco {
            font-size: 0.9rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .box-compra .valor-preco {
            font-size: 1.9rem;
            color: var(--dourado);
            font-weight: bold;
            margin: 5px 0 18px;
        }
        .btn-whatsapp {
            display: inline-block;
            width: 100%;
            background-color: #25D366;
            color: #fff;
            font-weight: bold;
            font-size: 1.05rem;
            padding: 14px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
            transform: translateY(-2px);
        }

        @media (max-width: 860px) {
            .detalhe-grid {
                grid-template-columns: 1fr;
            }
            .carrossel-principal {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <main class="container-detalhe">
        <a href="animais.venda.fazenda.html" class="voltar-link">&larr; Voltar para Animais à Venda</a>

        <div id="conteudo-detalhe">
            <p style="text-align: center; padding: 40px;">Carregando ficha do animal...</p>
        </div>
    </main>

    <!-- Cabeçalho e Rodapé Padronizados -->
    <script src="js/componentes.fazenda.js"></script>

    <script>
        let fotosCarrossel = [];
        let indiceFotoAtual = 0;

        function calcularIdade(dataNascimento) {
            if (!dataNascimento) return 'Não informada';
            const nasc = new Date(dataNascimento);
            if (isNaN(nasc.getTime())) return 'Não informada';

            const hoje = new Date();
            let meses = (hoje.getFullYear() - nasc.getFullYear()) * 12 + (hoje.getMonth() - nasc.getMonth());
            if (hoje.getDate() < nasc.getDate()) meses--;

            if (meses < 0) return 'Recém-nascido';
            if (meses < 12) return `${meses} ${meses === 1 ? 'mês' : 'meses'}`;
            
            const anos = Math.floor(meses / 12);
            const mesesRestantes = meses % 12;
            if (mesesRestantes === 0) return `${anos} ${anos === 1 ? 'ano' : 'anos'}`;
            return `${anos} ${anos === 1 ? 'ano' : 'anos'} e ${mesesRestantes} ${mesesRestantes === 1 ? 'mês' : 'meses'}`;
        }

        function atualizarFotoCarrossel(indice) {
            if (fotosCarrossel.length === 0) return;
            indiceFotoAtual = (indice + fotosCarrossel.length) % fotosCarrossel.length;
            
            const nomeArquivo = fotosCarrossel[indiceFotoAtual];
            const imgPrincipal = document.getElementById('foto-principal');
            imgPrincipal.src = `/uploads/${nomeArquivo}`;
            imgPrincipal.onerror = function() {
                this.onerror = null;
                this.src = `img/${nomeArquivo}`;
            };

            document.querySelectorAll('.miniatura-item').forEach((thumb, idx) => {
                thumb.classList.toggle('ativa', idx === indiceFotoAtual);
            });
        }

        function mudarFoto(direcao) {
            atualizarFotoCarrossel(indiceFotoAtual + direcao);
        }

        function renderizarVideo(videoUrl) {
            if (!videoUrl || videoUrl.trim() === '') return '';
            
            // Verifica se é link do YouTube ou arquivo local
            if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                let videoId = '';
                if (videoUrl.includes('v=')) {
                    videoId = videoUrl.split('v=')[1].split('&')[0];
                } else {
                    videoId = videoUrl.split('/').pop();
                }
                return `
                    <div class="video-section">
                        <h4>Vídeo de Apresentação (Máx. 1 min)</h4>
                        <iframe class="video-player" height="300" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
                    </div>
                `;
            }

            return `
                <div class="video-section">
                    <h4>Vídeo de Apresentação (Máx. 1 min)</h4>
                    <video class="video-player" controls preload="metadata">
                        <source src="/uploads/${videoUrl}" type="video/mp4">
                        Seu navegador não suporta a reprodução de vídeo.
                    </video>
                </div>
            `;
        }

        async function carregarDetalhesAnimal() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.getElementById('conteudo-detalhe').innerHTML = '<p style="text-align:center;">Animal não especificado.</p>';
                return;
            }

            try {
                const resposta = await fetch(`/api/animais/${id}`);
                if (!resposta.ok) throw new Error('Animal não encontrado');
                
                const animal = await resposta.json();

                // Coleta até 5 fotos válidas
                fotosCarrossel = [animal.foto_1, animal.foto_2, animal.foto_3, animal.foto_4, animal.foto_5]
                    .filter(f => f && f.trim() !== '');
                
                if (fotosCarrossel.length === 0) {
                    fotosCarrossel = ['1.png'];
                }

                const precoNum = Number(animal.preco);
                const precoFormatado = precoNum > 0 
                    ? `R$ ${precoNum.toLocaleString('pt-BR', {minimumFractionDigits: 2})}` 
                    : 'Preço a negociar';

                const idadeCalculada = calcularIdade(animal.nascimento);
                
                // Mensagem pronta para o WhatsApp da Fazenda Sabiá
                const textoWpp = encodeURIComponent(`Olá! Vi o exemplar Poll Dorset *${animal.nome}* (Tatuagem: ${animal.tatuagem || 'N/I'}) no site da Fazenda Sabiá e gostaria de mais informações.`);
                const linkWhatsapp = `https://wa.me/5553999102289?text=${textoWpp}`;

                const setasHtml = fotosCarrossel.length > 1 ? `
                    <button class="btn-carrossel btn-prev" onclick="mudarFoto(-1)" title="Foto anterior">&#10094;</button>
                    <button class="btn-carrossel btn-next" onclick="mudarFoto(1)" title="Próxima foto">&#10095;</button>
                ` : '';

                const miniaturasHtml = fotosCarrossel.length > 1 ? `
                    <div class="miniaturas-grid">
                        ${fotosCarrossel.map((foto, index) => `
                            <img src="/uploads/${foto}" 
                                 onerror="this.onerror=null; this.src='img/${foto}';" 
                                 class="miniatura-item ${index === 0 ? 'ativa' : ''}" 
                                 onclick="atualizarFotoCarrossel(${index})" 
                                 alt="Miniatura ${index + 1}">
                        `).join('')}
                    </div>
                ` : '';

                document.getElementById('conteudo-detalhe').innerHTML = `
                    <div class="detalhe-grid">
                        <!-- Coluna Esquerda: Carrossel de 5 Fotos + Vídeo -->
                        <div>
                            <div class="carrossel-container">
                                <img id="foto-principal" class="carrossel-principal" src="" alt="${animal.nome}">
                                ${setasHtml}
                            </div>
                            ${miniaturasHtml}
                            ${renderizarVideo(animal.video_url)}
                        </div>

                        <!-- Coluna Direita: Ficha Genética, Informações Adicionais, Preço e WhatsApp -->
                        <div class="info-animal">
                            ${animal.premio ? `<span class="badge-premio">${animal.premio}</span>` : ''}
                            <h1>${animal.nome}</h1>
                            <div class="tag-tatuagem">Tatuagem: ${animal.tatuagem || 'Não informada'} • ${animal.categoria || 'Poll Dorset'}</div>

                            <div class="ficha-tecnica">
                                <div class="ficha-linha">
                                    <span>Idade:</span>
                                    <span>${idadeCalculada}</span>
                                </div>
                                <div class="ficha-linha">
                                    <span>Pai:</span>
                                    <span>${animal.pai || 'Não informado'}</span>
                                </div>
                                <div class="ficha-linha">
                                    <span>Mãe:</span>
                                    <span>${animal.mae || 'Não informada'}</span>
                                </div>
                            </div>

                            <div class="info-adicionais">
                                <h3>Informações Adicionais</h3>
                                <p>${animal.descricao || 'Exemplar da raça Poll Dorset selecionado com rigor técnico na Fazenda Sabiá.'}</p>
                            </div>

                            <div class="box-compra">
                                <div class="label-preco">Investimento</div>
                                <div class="valor-preco">${precoFormatado}</div>
                                <a href="${linkWhatsapp}" target="_blank" class="btn-whatsapp">
                                    Tenho Interesse • Falar no WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                // Inicializa a primeira foto com fallback
                atualizarFotoCarrossel(0);

            } catch (error) {
                console.error('Erro ao carregar detalhes:', error);
                document.getElementById('conteudo-detalhe').innerHTML = '<p style="text-align:center; padding: 40px;">Não foi possível carregar as informações deste animal.</p>';
            }
        }

        carregarDetalhesAnimal();
    </script>
</body>
</html>
