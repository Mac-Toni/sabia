<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Animal - Fazenda Sabiá</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        /* Estilos básicos do Carrossel */
        .carrossel { position: relative; max-width: 100%; height: 400px; overflow: hidden; border-radius: 6px; background: #000; margin-bottom: 20px; }
        .carrossel img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .carrossel img.ativo { display: block; }
        .btn-carrossel { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 10px; cursor: pointer; font-size: 18px; }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }
        
        .info-grupo { margin-bottom: 15px; }
        .preco { font-size: 1.4rem; color: #2e7d32; font-weight: bold; }
        .btn-whatsapp { display: inline-block; background: #25d366; color: #fff; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .btn-whatsapp:hover { background: #1ebe5d; }
        video { width: 100%; max-height: 400px; border-radius: 6px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container" id="detalhe-container">
        <p>Carregando informações do animal...</p>
    </div>

    <script>
        let fotoAtualIndex = 0;
        let fotosArray = [];

        function mudarFoto(direcao) {
            fotosArray[fotoAtualIndex].classList.remove('ativo');
            fotoAtualIndex = (fotoAtualIndex + direzione + fotosArray.length) % fotosArray.length;
            fotosArray[fotoAtualIndex].classList.add('ativo');
        }

        async function carregarDetalhes() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                document.getElementById('detalhe-container').innerHTML = '<h2>Animal não encontrado.</h2>';
                return;
            }

            try {
                const resposta = await fetch(`/api/animais/${id}`);
                const animal = await resposta.json();

                if (!animal) {
                    document.getElementById('detalhe-container').innerHTML = '<h2>Animal não localizado no sistema.</h2>';
                    return;
                }

                // Coleta até 5 fotos preenchidas
                const fotos = [animal.foto_1, animal.foto_2, animal.foto_3, animal.foto_4, animal.foto_5].filter(f => f);
                
                // Formatação de preço
                const textoPreco = animal.preco ? `R$ ${Number(animal.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : 'Preço a negociar';

                // Mensagem pronta para o WhatsApp da Fazenda
                const numeroWhatsApp = "5599999999999"; // Substitua pelo número real da fazenda com DDI e DDD
                const mensagemWpp = encodeURIComponent(`Olá! Tenho interesse no animal *${animal.nome}* (Tatuagem: ${animal.tatuagem}) visto no site da Fazenda Sabiá.`);
                const linkWpp = `https://wa.me/${numeroWhatsApp}?text=${mensagemWpp}`;

                // Montando o HTML da página
                let html = `
                    <h1>${animal.nome}</h1>
                    <p><strong>Tatuagem:</strong> ${animal.tatuagem} | <strong>Categoria:</strong> ${animal.categoria}</p>

                    <!-- Carrossel de Fotos -->
                    <div class="carrossel" id="box-carrossel">
                        ${fotos.length > 0 ? fotos.map((f, i) => `<img src="/uploads/${f}" class="${i === 0 ? 'ativo' : ''}">`).join('') : '<p style="color:#fff; text-align:center; line-height:400px;">Sem fotos cadastradas</p>'}
                        ${fotos.length > 1 ? `
                            <button class="btn-carrossel btn-prev" onclick="mudarFoto(-1)">&#10094;</button>
                            <button class="btn-carrossel btn-next" onclick="mudarGenealogia(1) && mudarFoto(1)">&#10095;</button> <!-- Ajustado simples abaixo -->
                        ` : ''}
                    </div>
                `;

                // Botões de navegação do carrossel caso tenha mais de 1 foto
                // (Correção simples do botão próximo do carrossel no template string)
                if (fotos.length > 1) {
                    html = html.replace('onclick="mudarGenealogia(1) && mudarFoto(1)"', 'onclick="mudarFoto(1)"');
                }

                html += `
                    <div class="info-grupo">
                        <p class="preco">Valor: ${textoPreco}</p>
                        <p><strong>Idade / Nascimento:</strong> ${animal.nascimento || 'Não informada'}</p>
                        <p><strong>Pai:</strong> ${animal.pai || 'Não informado'}</p>
                        <p><strong>Mãe:</strong> ${animal.mae || 'Não informada'}</p>
                        <p><strong>Premiação:</strong> ${animal.premio || 'Nenhuma registrada'}</p>
                        <p><strong>Descrição:</strong> ${animal.descricao || 'Sem descrição adicional.'}</p>
                    </div>
                `;

                // Se houver vídeo cadastrado
                if (animal.video_url) {
                    html += `
                        <h3>Vídeo do Animal (Até 1 min)</h3>
                        <video controls>
                            <source src="/uploads/${animal.video_url}" type="video/mp4">
                            Seu navegador não suporta vídeos.
                        </video>
                    `;
                }

                html += `
                    <br>
                    <a href="${linkWpp}" target="_blank" class="btn-whatsapp">📲 Falar no WhatsApp da Fazenda</a>
                `;

                document.getElementById('detalhe-container').innerHTML = html;

                // Atualiza a lista de elementos do carrossel para o script global
                fotosArray = document.querySelectorAll('.carrossel img');
                fotoAtualIndex = 0;

            } catch (error) {
                console.error('Erro ao carregar detalhes:', error);
                document.getElementById('detalhe-container').innerHTML = '<p>Erro ao carregar os dados do animal.</p>';
            }
        }

        carregarDetalhes();
    </script>
</body>
</html>
