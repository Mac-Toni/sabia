<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais à Venda - Fazenda Sabiá</title>
    <link rel="stylesheet" href="css/estilo.fazenda.css">
    <style>
        .cabecalho-pagina {
            background-color: var(--azul-medio);
            color: var(--branco);
            padding: 40px 5%;
            text-align: center;
            border-bottom: 3px solid var(--dourado);
        }
        .cabecalho-pagina h1 {
            color: var(--dourado);
            font-size: 2.3rem;
            margin-bottom: 10px;
        }
        .container-plantel {
            padding: 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Ajustes específicos para o card da vitrine de vendas */
        .card-animal {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-animal:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .card-body p {
            margin: 6px 0;
            font-size: 0.95rem;
            color: var(--texto-escuro);
        }
        .preco-venda {
            font-size: 1.15rem;
            color: var(--azul-escuro);
            font-weight: bold;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
        }
        .sem-registros {
            text-align: center;
            padding: 40px;
            background: var(--branco);
            border-radius: 8px;
            color: var(--texto-escuro);
            font-size: 1.1rem;
            grid-column: 1 / -1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Cabeçalho da Página -->
    <header class="cabecalho-pagina">
        <h1>Plantel Comercial</h1>
        <p>Genética de ponta em ovinos da raça Poll Dorset diretamente para o seu rebanho.</p>
    </header>

    <!-- Conteúdo Principal / Vitrine -->
    <main class="container-plantel">
        <div class="grid-animais" id="lista-animais">
            <!-- Os cards dos animais serão injetados dinamicamente via JavaScript -->
        </div>
    </main>

    <!-- Script que injeta automaticamente o cabeçalho unificado e o rodapé -->
    <script src="js/componentes.fazenda.js"></script>

    <script>
        async function carregarAnimaisVenda() {
            try {
                const resposta = await fetch('/api/animais/venda');
                const animais = await resposta.json();
                
                const container = document.getElementById('lista-animais');
                container.innerHTML = '';

                if (animais.length === 0) {
                    container.innerHTML = '<div class="sem-registros">Nenhum animal à venda no momento. Volte em breve ou entre em contato!</div>';
                    return;
                }

                animais.forEach(animal => {
                    const fotoCapa = animal.foto_1 ? `/uploads/${animal.foto_1}` : 'img/sem-foto.jpg';
                    const precoFormatado = animal.preco ? `R$ ${Number(animal.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : 'Preço a negociar';

                    const card = document.createElement('div');
                    card.className = 'card-animal';
                    card.onclick = () => {
                        window.location.href = `detalhe.fazenda.html?id=${animal.id}`;
                    };

                    card.innerHTML = `
                        <img src="${fotoCapa}" alt="${animal.nome}">
                        <div class="card-body">
                            <span class="badge-premio">Disponível</span>
                            <h3>${animal.nome}</h3>
                            <p><strong>Tatuagem:</strong> ${animal.tatuagem}</p>
                            <p><strong>Pai:</strong> ${animal.pai || 'Não informado'}</p>
                            <p><strong>Mãe:</strong> ${animal.mae || 'Não informada'}</p>
                            <div class="preco-venda">${precoFormatado}</div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Erro ao carregar animais à venda:', error);
                document.getElementById('lista-animais').innerHTML = '<div class="sem-registros">Erro ao carregar os dados. Verifique a conexão com o servidor.</div>';
            }
        }

        carregarAnimaisVenda();
    </script>
</body>
</html>
