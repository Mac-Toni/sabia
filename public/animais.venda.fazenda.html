<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais à Venda - Fazenda Sabiá</title>
    <link rel="stylesheet" href="css/estilo.fazenda.css">
    <style>
        /* Estilos da Vitrine de Vendas */
        .card-animal {
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-animal:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .card-img-principal {
            width: 100%;
            height: 260px;
            object-fit: cover;
            object-position: center 20%;
            display: block;
            background-color: var(--azul-escuro);
        }
        .filiacao-info {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }
        .aviso-vitrine {
            text-align: center;
            margin-bottom: 40px;
            color: var(--texto-escuro);
        }
    </style>
</head>
<body>

    <!-- O cabeçalho será injetado via componentes.fazenda.js -->
    <div id="header-container"></div>

    <main class="destaques-fazenda">
        <h1 class="section-title">Vitrine de Comercialização</h1>
        <p class="aviso-vitrine">Confira nossos lotes disponíveis. Clique no animal para ver a galeria de fotos, vídeo de apresentação e detalhes completos.</p>

        <!-- Grid dinâmico onde os animais vindos do banco serão injetados via JavaScript -->
        <div class="grid-animais" id="grid-vendas">
            <!-- Card de Exemplo Estático (Será substituído pelo carregamento da API) -->
            <div class="card-animal" onclick="window.location.href='detalhe.fazenda.html?id=1'">
                <img src="img/1.png" alt="Sabiá Champion 01" class="card-img-principal">
                <div class="card-body">
                    <span class="badge-premio">Reprodutor (SO)</span>
                    <h3>Sabiá Champion 01</h3>
                    <p style="font-size: 0.9rem; color: #555; margin-bottom: 5px;">Tatuagem: <b>SB-104</b></p>
                    <div class="filiacao-info">
                        <strong>Pai:</strong> Sabiá Apollo<br>
                        <strong>Mãe:</strong> Sabiá Diana
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- O rodapé será injetado via componentes.fazenda.js -->
    <div id="footer-container"></div>

    <!-- Scripts do Sistema -->
    <script src="js/componentes.fazenda.js"></script>
    <script>
        // Função para carregar os animais cadastrados na vitrine de vendas via API
        async function carregarVitrineVendas() {
            try {
                const response = await fetch('/api/animais'); // Rota que busca todos os animais
                const animais = await response.json();
                
                const gridVendas = document.getElementById('grid-vendas');
                if (!gridVendas) return;

                if (animais.length === 0) {
                    gridVendas.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Nenhum animal disponível no momento.</p>';
                    return;
                }

                gridVendas.innerHTML = ''; // Limpa o exemplo estático

                animais.forEach(animal => {
                    const card = document.createElement('div');
                    card.className = 'card-animal';
                    // Ao clicar no card, redireciona para a página única de detalhes passando o ID
                    card.onclick = () => {
                        window.location.href = `detalhe.fazenda.html?id=${animal.id}`;
                    };

                    card.innerHTML = `
                        <img src="${animal.foto_1 || 'img/1.png'}" alt="${animal.nome}" class="card-img-principal">
                        <div class="card-body">
                            <span class="badge-premio">${animal.categoria || 'Reprodutor / Matriz'}</span>
                            <h3>${animal.nome}</h3>
                            <p style="font-size: 0.9rem; color: #555; margin-bottom: 5px;">Tatuagem: <b>${animal.tatuagem || '---'}</b></p>
                            <div class="filiacao-info">
                                <strong>Pai:</strong> ${animal.pai || 'Não informado'}<br>
                                <strong>Mãe:</strong> ${animal.mae || 'Não informado'}
                            </div>
                        </div>
                    `;
                    gridVendas.appendChild(card);
                });
            } catch (erro) {
                console.error('Erro ao carregar a vitrine de vendas:', erro);
            }
        }

        // Executa o carregamento ao abrir a página
        document.addEventListener('DOMContentLoaded', carregarVitrineVendas);
    </script>
</body>
</html>
